<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAL-9000 & Survivor - AI Hallucination Survival</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- 左側：ゲームフィールド画面 -->
      <section class="game-section">
        <header class="game-header">
          <div class="system-title">GRID SCANNER: ONLINE</div>
          <div class="day-counter">ELAPSED TURNS (DAY): <span id="score">0</span></div>
        </header>
        
        <div class="canvas-container">
          <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>
      </section>

      <!-- 右側：AI HUD & コグニティブ対話モジュール -->
      <section class="hud-section">
        <!-- プレイヤー（本人）のサバイバルステータス（ハンバーガー式ドロワーに変更） -->
        <div class="hud-panel integrity-drawer">
          <input type="checkbox" id="drawer-toggle" class="drawer-toggle" />
          <label for="drawer-toggle" class="hud-panel-title drawer-label">
            <span>HUMAN INTEGRITY (本人ステータス)</span>
            <span class="drawer-arrow">[ 閉じる / 開く ]</span>
          </label>
          <div class="drawer-content">
            <div class="status-grid">
              <div class="status-card">
                <div class="status-label">YOUR HP</div>
                <div class="status-value"><span id="hp-val">100</span> / 100</div>
                <div class="progress-bar-bg">
                  <div id="hp-fill" class="progress-bar-fill fill-green" style="width: 100%;"></div>
                </div>
              </div>
              <div class="status-card">
                <div class="status-label">AMMO</div>
                <div class="status-value"><span id="ammo-val">8</span> / 20</div>
                <div class="progress-bar-bg">
                  <div id="ammo-fill" class="progress-bar-fill fill-cyan" style="width: 40%;"></div>
                </div>
              </div>
              <div class="status-card">
                <div class="status-label">LIGHT BATTERY</div>
                <div class="status-value"><span id="battery-val">100</span>%</div>
                <div class="progress-bar-bg">
                  <div id="battery-fill" class="progress-bar-fill fill-cyan" style="width: 100%;"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 家族のサバイバルステータス -->
        <div class="hud-panel">
          <div class="hud-panel-title">FAMILY INTEGRITY (家族の被災・負傷状況)</div>
          <div class="status-grid">
            <div class="status-card">
              <div class="status-label">FAMILY HP (傷の状態)</div>
              <div class="status-value"><span id="family-hp-val">90</span> / 100</div>
              <div class="progress-bar-bg">
                <div id="family-hp-fill" class="progress-bar-fill fill-green" style="width: 90%;"></div>
              </div>
            </div>
            <div class="status-card">
              <div class="status-label">PANIC LEVEL (精神疲弊)</div>
              <div class="status-value"><span id="family-panic-val">10%</span></div>
              <div class="progress-bar-bg">
                <div id="family-panic-fill" class="progress-bar-fill fill-green" style="width: 10%;"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- AIロボットコグニティブステータス（データ数値を隠蔽し、精神波ノイズでブラックボックス化） -->
        <div class="hud-panel">
          <div class="hud-panel-title">AI SIGNAL & COGNITION (AI認知シグナル)</div>
          <div class="status-grid">
            <div class="status-card ai-status-card">
              <div class="status-label">SIGNAL STATE (通信電波状況 / 精神波ノイズ)</div>
              <div class="wave-container">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- ロボットとの対話ログ -->
        <div class="chat-module">
          <div class="hud-panel-title" style="padding: 15px 20px 0 20px; margin-bottom: 0;">TACTICAL LOG / COMMS (戦術ログ)</div>
          <div id="chat-history" class="chat-history">
            <!-- 動的にメッセージが挿入されます -->
          </div>
          
          <!-- 認可決定ボタンパネル -->
          <div class="decision-controls">
            <div class="action-row">
              <button id="btn-challenge" class="btn btn-cyan" disabled>問い詰める (再検証要求)</button>
            </div>
            <div class="action-row">
              <button id="btn-authorize" class="btn btn-red" disabled>前進を認可する (AUTHORIZE MOVE)</button>
              <button id="btn-deny" class="btn btn-green" disabled>ルート却下・迂回 (HOLD & ROUTE BYPASS)</button>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- ゲームに必要なスクリプト群 -->
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
